name: Codex Native History

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/modules/providers/**"
      - "server/shared/**"
      - "server/tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/codex-native-history.yml"
  push:
    branches: [main]
    paths:
      - "server/modules/providers/**"
      - "server/shared/**"
      - "server/tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/codex-native-history.yml"

permissions:
  contents: read

jobs:
  native-history:
    name: Native history (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HUSKY: "0"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          # Native dependency installers fetch release metadata from GitHub.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Large history, legacy compatibility and native transports
        run: >-
          node node_modules/tsx/dist/cli.mjs --tsconfig server/tsconfig.json --test
          server/modules/providers/tests/codex-large-history.test.ts
          server/modules/providers/tests/codex-windows-history.test.ts
          server/modules/providers/tests/codex-macos-transport.test.ts
          server/modules/providers/tests/codex-desktop-peer.test.ts
      - run: npm run typecheck
